version: '3.8'
services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
  celery_worker:
    build: ..
    command: celery -A backend.celery_app.celery_app worker -Q treasury -l info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
  celery_beat:
    build: ..
    command: celery -A backend.celery_app.celery_app beat -l info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
